    SponsorPackage:
      type: object
      required: [packageKey, label, amountCents, currency, termDays, description]
      properties:
        packageKey:
          type: string
          description: Stable identifier for the commercial package.
        label:
          type: string
        amountCents:
          type: number
          minimum: 1
          multipleOf: 1
        currency:
          type: string
          enum: [cad]
        termDays:
          type: number
          minimum: 1
          multipleOf: 1
        description:
          type: string
    SponsorOfferResponse:
      type: object
