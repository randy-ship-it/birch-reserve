    CommercialInquiryInput:
      type: object
      required:
        [
          inquiryType,
          name,
          email,
          company,
          website,
          category,
          coverageRegion,
          details,
          transactionConsent,
        ]
      properties:
        inquiryType:
          type: string
          enum: [branded_hub, fulfillment]
        name:
          type: string
          minLength: 2
          maxLength: 120
