openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
x-ucp-version: "2026-04-08"
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: launch
    description: Public Birch Reserve pilot and insight operations
  - name: concierge
    description: Privacy-safe advertising format guidance
  - name: marketplace
    description: Private partner marketplace operations
  - name: editorial
    description: Evidence-led editorial publishing operations
paths:
  /.well-known/ucp:
    get:
      operationId: getBirchReserveUcpProfile
      tags: [launch]
      servers: [{ url: / }]
      summary: Discover the opt-in Birch Reserve UCP checkout service
      responses:
        "200": { description: UCP business profile, content: { application/json: { schema: { $ref: "#/components/schemas/BirchReserveUcpProfile" } } } }
        "503": { description: Public HTTPS origin is not configured }
  /ucp/v1/checkout-sessions:
    post:
      operationId: createBirchReserveUcpCheckout
      tags: [launch]
      servers: [{ url: / }]
      summary: Create a UCP checkout that escalates to Stripe-hosted buyer review
      description: Retrying with the original Idempotency-Key is also the secure continuity-enrollment path for an active checkout created before signing-key ownership was introduced. The request must authenticate as the original profile and match that checkout's original URL-scoped idempotency namespace, so current profile-URL control alone cannot claim it.
      parameters:
        - { name: Idempotency-Key, in: header, required: false, description: "Strongly recommended for retry safety; when omitted, a fresh key is generated and returned in the Idempotency-Key response header.", schema: { type: string, minLength: 22, maxLength: 200 } }
        - { $ref: "#/components/parameters/UcpRequestId" }
        - { $ref: "#/components/parameters/UcpAgent" }
        - { $ref: "#/components/parameters/UcpAgentTimestamp" }
        - { $ref: "#/components/parameters/UcpAgentNonce" }
        - { $ref: "#/components/parameters/UcpAgentSignature" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BirchReserveUcpCheckoutInput" }
      responses:
        "201":
          description: Durable UCP checkout session requiring trusted Stripe-hosted buyer review
          headers:
            Idempotency-Key:
              description: Effective key for retries and any later verified identity rotation; generated by the server when omitted from the request.
              required: true
              schema: { type: string, minLength: 22, maxLength: 200 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BirchReserveUcpCheckout" }
        "400": { description: Invalid UCP checkout request or required protocol header, content: { application/json: { schema: { $ref: "#/components/schemas/BirchReserveUcpError" } } } }
        "404": { description: Agent authentication failed, content: { application/json: { schema: { $ref: "#/components/schemas/BirchReserveUcpError" } } } }
        "409": { description: Inventory or idempotency conflict, content: { application/json: { schema: { $ref: "#/components/schemas/BirchReserveUcpError" } } } }
        "503": { description: Reservation saved but Stripe handoff is unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/BirchReserveUcpError" } } } }
  /ucp/v1/checkout-sessions/{id}:
    get:
      operationId: getBirchReserveUcpCheckout
      tags: [launch]
      servers: [{ url: / }]
      summary: Retrieve a UCP checkout session owned by the negotiated agent profile
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, minLength: 36, maxLength: 36 } }
        - { $ref: "#/components/parameters/UcpRequestId" }
        - { $ref: "#/components/parameters/UcpAgent" }
        - { $ref: "#/components/parameters/UcpAgentTimestamp" }
        - { $ref: "#/components/parameters/UcpAgentNonce" }
        - { $ref: "#/components/parameters/UcpAgentSignature" }
      responses:
        "200": { description: Current UCP checkout state, content: { application/json: { schema: { $ref: "#/components/schemas/BirchReserveUcpCheckout" } } } }
        "400": { description: Invalid required protocol header, content: { application/json: { schema: { $ref: "#/components/schemas/BirchReserveUcpError" } } } }
        "404": { description: UCP checkout session not found for the authenticated agent identity, content: { application/json: { schema: { $ref: "#/components/schemas/BirchReserveUcpError" } } } }
    put:
      operationId: rejectBirchReserveUcpCheckoutUpdate
      tags: [launch]
      servers: [{ url: / }]
      summary: Reject unsupported agent-side checkout updates
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/UcpRequestId" }
        - { $ref: "#/components/parameters/UcpAgent" }
        - { $ref: "#/components/parameters/UcpAgentTimestamp" }
        - { $ref: "#/components/parameters/UcpAgentNonce" }
        - { $ref: "#/components/parameters/UcpAgentSignature" }
      responses:
        "405": { description: Hosted buyer handoff is required, content: { application/json: { schema: { $ref: "#/components/schemas/BirchReserveUcpError" } } } }
  /ucp/v1/checkout-sessions/{id}/complete:
    post:
      operationId: rejectBirchReserveUcpCheckoutCompletion
      tags: [launch]
      servers: [{ url: / }]
      summary: Reject unsupported delegated payment completion
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/UcpRequestId" }
        - { $ref: "#/components/parameters/UcpAgent" }
        - { $ref: "#/components/parameters/UcpAgentTimestamp" }
        - { $ref: "#/components/parameters/UcpAgentNonce" }
        - { $ref: "#/components/parameters/UcpAgentSignature" }
      responses:
        "405": { description: Stripe-hosted buyer completion is required, content: { application/json: { schema: { $ref: "#/components/schemas/BirchReserveUcpError" } } } }
  /ucp/v1/checkout-sessions/{id}/cancel:
    post:
      operationId: cancelBirchReserveUcpCheckout
      tags: [launch]
      servers: [{ url: / }]
      summary: Cancel an unpaid UCP checkout owned by the negotiated agent profile and release its reserve hold
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, minLength: 36, maxLength: 36 } }
        - { $ref: "#/components/parameters/UcpRequestId" }
        - { $ref: "#/components/parameters/UcpAgent" }
        - { $ref: "#/components/parameters/UcpAgentTimestamp" }
        - { $ref: "#/components/parameters/UcpAgentNonce" }
        - { $ref: "#/components/parameters/UcpAgentSignature" }
      responses:
        "200": { description: Current terminal checkout state; repeated requests are idempotent, content: { application/json: { schema: { $ref: "#/components/schemas/BirchReserveUcpCheckout" } } } }
        "400": { description: Invalid required protocol header, content: { application/json: { schema: { $ref: "#/components/schemas/BirchReserveUcpError" } } } }
        "404": { description: UCP checkout session not found for the authenticated agent identity, content: { application/json: { schema: { $ref: "#/components/schemas/BirchReserveUcpError" } } } }
        "409": { description: Checkout payment state changed before cancellation could safely finish, content: { application/json: { schema: { $ref: "#/components/schemas/BirchReserveUcpError" } } } }
        "503": { description: "Stripe could not be resolved or expired, so the inventory hold remains in place", content: { application/json: { schema: { $ref: "#/components/schemas/BirchReserveUcpError" } } } }
  /ucp/v1/checkout-sessions/{id}/identity-rotations:
    post:
      operationId: rotateBirchReserveUcpCheckoutIdentity
      tags: [launch]
      servers: [{ url: / }]
      summary: Move an active checkout to a verified replacement agent profile
      description: The replacement profile is negotiated through UCP-Agent. UCP-Identity-Continuity must be a short-lived EdDSA compact JWS signed by the continuity key recorded from the previous profile when the checkout was created. Its iss and sub claims are the previous and replacement profile URLs, its aud is urn:birch-reserve:ucp-checkout:{id}, and it includes numeric iat and exp plus a unique jti. The original idempotency key is required so retries by the replacement resolve the transferred checkout. This prevents profile URL possession alone from transferring ownership.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, minLength: 36, maxLength: 36 } }
        - { $ref: "#/components/parameters/UcpRequestId" }
        - { $ref: "#/components/parameters/UcpAgent" }
        - { $ref: "#/components/parameters/UcpAgentTimestamp" }
        - { $ref: "#/components/parameters/UcpAgentNonce" }
        - { $ref: "#/components/parameters/UcpAgentSignature" }
        - { name: UCP-Identity-Continuity, in: header, required: true, description: Ed25519-signed compact JWS authorization from the checkout's recorded previous identity., schema: { type: string, maxLength: 8192 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BirchReserveUcpIdentityRotationInput" }
      responses:
        "200": { description: Checkout ownership moved to the replacement identity, content: { application/json: { schema: { $ref: "#/components/schemas/BirchReserveUcpCheckout" } } } }
        "400": { description: Invalid required protocol header, content: { application/json: { schema: { $ref: "#/components/schemas/BirchReserveUcpError" } } } }
        "404": { description: Checkout or verified previous identity was not found, content: { application/json: { schema: { $ref: "#/components/schemas/BirchReserveUcpError" } } } }
  /llms.txt:
    get:
      operationId: getBirchReserveLlmsText
      tags: [launch]
      servers: [{ url: / }]
      responses:
        "200": { description: Machine-readable buying overview, content: { text/plain: { schema: { type: string } } } }
  /v1/catalog.json:
    get:
      operationId: getBirchReserveCatalog
      tags: [launch]
      servers: [{ url: / }]
      responses:
        "200": { description: Canonical USD offer ladder, content: { application/json: { schema: { $ref: "#/components/schemas/BirchReserveCatalog" } } } }
  /v1/availability.json:
    get:
      operationId: getBirchReserveAvailability
      tags: [launch]
      servers: [{ url: / }]
      responses:
        "200": { description: Conservative shared rolling seat availability, content: { application/json: { schema: { $ref: "#/components/schemas/BirchReserveAvailability" } } } }
  /v1/quote:
    get:
      operationId: getBirchReserveQuote
      tags: [launch]
      servers: [{ url: / }]
      parameters:
        - { name: sku, in: query, required: true, schema: { $ref: "#/components/schemas/BirchReserveSku" } }
        - { name: format, in: query, required: true, schema: { type: string, enum: [post_checkout, recovery_plan, scheduled_service, member_hub, motion_15s] } }
        - { name: days, in: query, required: true, schema: { type: integer, enum: [30, 90, 180] } }
      responses:
        "200": { description: Exact USD quote for one canonical SKU, content: { application/json: { schema: { $ref: "#/components/schemas/BirchReserveQuote" } } } }
        "400": { description: "Unsupported SKU, format, or window" }
  /v1/checkout:
    post:
      operationId: createBirchReserveCheckout
      tags: [launch]
      servers: [{ url: / }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BirchReserveCheckoutInput" }
      responses:
        "200": { description: Durable reservation and Stripe Checkout session, content: { application/json: { schema: { type: object, additionalProperties: false, required: [checkout_url, order_id, reservationId, amountCents, currency], properties: { checkout_url: { type: string }, order_id: { type: string }, reservationId: { type: string }, amountCents: { type: number, multipleOf: 1 }, currency: { type: string, enum: [usd] } } } } } }
        "400": { description: Invalid checkout request }
        "409": { description: Idempotency or reservation state conflict }
        "503": { description: Reservation saved but payment unavailable, content: { application/json: { schema: { type: object, additionalProperties: false, required: [error, checkout_url, order_id, reservationId, amountCents, currency], properties: { error: { type: string }, checkout_url: { type: ["string", "null"] }, order_id: { type: string }, reservationId: { type: string }, amountCents: { type: number, multipleOf: 1 }, currency: { type: string, enum: [usd] } } } } } }
  /v1/orders/{id}:
    get:
      operationId: getBirchReserveOrder
      tags: [launch]
      servers: [{ url: / }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, minLength: 36, maxLength: 36 } }
      responses:
        "200": { description: Public-safe order receipt, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "404": { description: Order not found }
  /v1/orders/{id}/confirm:
    post:
      operationId: confirmBirchReserveOrder
      tags: [launch]
      servers: [{ url: / }]
      summary: Verify a returning Stripe Checkout session and reconcile its order
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, minLength: 36, maxLength: 36 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BirchReserveOrderConfirmation" }
      responses:
        "200": { description: Public-safe order receipt after server-side Stripe verification, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "400": { description: Invalid checkout session }
        "404": { description: Order not found }
        "409": { description: Checkout session does not belong to this order }
  /v1/orders/{id}/io.json:
    get:
      operationId: getBirchReserveInsertionOrder
      tags: [launch]
      servers: [{ url: / }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, minLength: 36, maxLength: 36 } }
      responses:
        "200": { description: Public-safe insertion order receipt, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "404": { description: Order not found }
  /v1/placements:
    get:
      operationId: listPublicBirchReservePlacements
      tags: [launch]
      servers: [{ url: / }]
      parameters:
        - { name: status, in: query, required: true, schema: { type: string, enum: [open] } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [post_checkout, recovery_plan, scheduled_service, member_hub, motion_15s] } }
      responses:
        "200": { description: Public-safe open placement projection, content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: false, required: [id, format, status, window, reserve_url], properties: { id: { type: string }, format: { type: string }, status: { type: string }, window: { type: string }, reserve_url: { type: string } } } } } } }
        "400": { description: Unsupported projection query }
  /openapi.yaml:
    get:
      operationId: getOpenApiContract
      tags: [launch]
      servers: [{ url: / }]
      responses:
        "200": { description: This OpenAPI contract, content: { application/yaml: { schema: { type: string } } } }
  /buycalc:
    get:
      operationId: getBirchReserveBuyCalculator
      tags: [launch]
      servers: [{ url: / }]
      responses:
        "200": { description: Human-readable no-login buy calculator, content: { text/html: { schema: { type: string } } } }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /launch/status:
    get:
      operationId: getLaunchStatus
      tags: [launch]
      summary: Get the current Birch Reserve launch mode
      responses:
        "200":
          description: Current public launch status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaunchStatus"
  /launch/waitlist:
    post:
      operationId: joinPilotWaitlist
      tags: [launch]
      summary: Join the Birch Reserve pilot queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PilotWaitlistInput"
      responses:
        "200":
          description: Pilot request accepted without revealing prior membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotWaitlistReceipt"
        "202":
          description: Pilot request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotWaitlistReceipt"
        "400":
          description: Invalid waitlist submission
  /launch/commercial-inquiries:
    post:
      operationId: createCommercialInquiry
      tags: [launch]
      summary: Submit a branded-hub or fulfillment inquiry
      description: Captures a private commercial request without creating a placement, fulfillment commitment, or payment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommercialInquiryInput"
      responses:
        "202":
          description: Commercial inquiry accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommercialInquiryReceipt"
        "400":
          description: Invalid commercial inquiry
  /launch/category-insights:
    get:
      operationId: listCategoryInsights
      tags: [launch]
      summary: List privacy-thresholded marketplace category insights
      description: Returns only aggregate first-party marketplace delivery activity. Low-volume categories do not expose counts or rates.
      responses:
        "200":
          description: Current public category insight collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryInsightCollection"
  /launch/sponsor/offer:
    get:
      operationId: getSponsorOffer
      tags: [launch]
      summary: Get current Founding Sponsor offer status and package definitions
      description: Returns public request-only package definitions. No payment is collected by this application.
      responses:
        "200":
          description: Current sponsor offer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorOfferResponse"
  /launch/splash/reserve:
    post:
      operationId: createSplashAdReservation
      tags: [launch]
      summary: Reserve a canonical USD Birch Reserve access or pilot credit
      description: Stores the advertiser's brand and work email with the exact selected offer and amount. If Stripe is connected, the response includes a Checkout URL. Otherwise the shared reserve seat is held without claiming a charge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplashAdReservationInput"
      responses:
        "200":
          description: Reservation stored and Stripe Checkout is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplashAdReservationReceipt"
        "202":
          description: Reservation stored and held until payments are enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplashAdReservationReceipt"
        "400":
          description: Invalid Splash Ad reservation
        "409":
          description: The submitted displayed quote is no longer current
  /launch/concierge/advice:
    post:
      operationId: createConciergeAdvice
      tags: [concierge]
      summary: Get request-only advertising format guidance
      description: Returns bounded guidance from anonymous advertising-intent signals derived in the browser. Question text, email, payment, inventory reservation, activation, and chat transcripts are not accepted or collected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConciergeAdviceInput"
      responses:
        "200":
          description: Advertising guidance or a deterministic fallback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConciergeAdviceResponse"
        "400":
          description: Invalid or oversized concierge request
  /launch/advertiser-intake:
    post:
      operationId: createAdvertiserIntake
      tags: [concierge]
      summary: Capture a structured advertiser follow-up request
      description: Stores an email and bounded onboarding selections for a requested follow-up. Chat text, transcripts, health information, payment, inventory reservation, and marketing consent are not accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvertiserIntakeInput"
      responses:
        "202":
          description: Advertiser follow-up request received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvertiserIntakeReceipt"
        "400":
          description: Invalid advertiser follow-up request
  /launch/admin/advertiser-intakes:
    get:
      operationId: listAdvertiserIntakes
      tags: [launch]
      summary: List private advertiser follow-up requests
      description: Returns contact details and bounded intake selections only to signed-in staff with an active sales role. Guide questions and transcripts are never stored and cannot appear in this response.
      security:
        - ClerkSession: []
      responses:
        "200":
          description: Private advertiser follow-up queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdvertiserIntakeQueueItem"
        "401":
          description: Staff authentication failed
        "403":
          description: Signed-in account does not have active sales access
  /launch/admin/advertiser-intakes/{intakeId}:
    patch:
      operationId: updateAdvertiserIntakeReviewStatus
      tags: [launch]
      summary: Update a private advertiser follow-up request
      description: Records the authenticated sales teammate responsible for each review-status change.
      security:
        - ClerkSession: []
      parameters:
        - name: intakeId
          in: path
          required: true
          schema:
            type: string
            minLength: 36
            maxLength: 36
            description: UUID advertiser-intake identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvertiserIntakeReviewUpdate"
      responses:
        "200":
          description: Updated advertiser follow-up review status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvertiserIntakeReviewReceipt"
        "400":
          description: Invalid review status
        "401":
          description: Staff authentication failed
        "403":
          description: Signed-in account does not have active sales access
        "404":
          description: Advertiser follow-up request not found
  /launch/admin/sales-staff:
    get:
      operationId: listSalesStaffAccess
      tags: [launch]
      summary: List sales teammate access
      description: Returns only the sales access roster to signed-in staff with an active sales-manager role. Advertiser requests and contact details are not included.
      security:
        - ClerkSession: []
      responses:
        "200":
          description: Private sales access roster
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalesStaffAccessItem"
        "401":
          description: Staff authentication failed
        "403":
          description: Signed-in account does not have active sales-manager access
    post:
      operationId: grantSalesStaffAccess
      tags: [launch]
      summary: Grant one teammate sales access
      description: Grants or restores one sales teammate and records the authenticated manager responsible for the change.
      security:
        - ClerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalesStaffAccessInput"
      responses:
        "200":
          description: Granted sales teammate access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesStaffAccessItem"
        "400":
          description: Invalid teammate details
        "401":
          description: Staff authentication failed
        "403":
          description: Signed-in account does not have active sales-manager access
        "409":
          description: Teammate already has active access or the email belongs to a protected manager
  /launch/admin/sales-staff/{staffAccessId}:
    patch:
      operationId: revokeSalesStaffAccess
      tags: [launch]
      summary: Revoke one teammate's sales access
      description: Revokes one sales teammate and records the authenticated manager responsible for the change. Manager accounts cannot be targeted.
      security:
        - ClerkSession: []
      parameters:
        - name: staffAccessId
          in: path
          required: true
          schema:
            type: string
            minLength: 36
            maxLength: 36
            description: UUID sales-access identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalesStaffAccessRevocation"
      responses:
        "200":
          description: Revoked sales teammate access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesStaffAccessItem"
        "400":
          description: Invalid revocation request
        "401":
          description: Staff authentication failed
        "403":
          description: Signed-in account does not have active sales-manager access
        "404":
          description: Sales teammate not found
        "409":
          description: Sales teammate access is already revoked
  /launch/splash/status:
    get:
      operationId: getSplashAdReservationStatus
      tags: [launch]
      summary: Get a private Splash Ad activation status
      description: Returns only the state associated with an unguessable activation token. Pending requests never expose a payment link.
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string, minLength: 36 }
      responses:
        "200":
          description: Private Splash Ad status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplashAdReservationStatus"
        "404":
          description: Token not found
  /launch/splash/checkout:
    post:
      operationId: createSplashAdCheckout
      tags: [launch]
      summary: Create a private Stripe checkout for an approved Splash Ad
      description: Creates an exact stored-value Stripe Checkout Session for the approved reservation offer. Repeated calls reuse an open session and never create a second payment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplashAdCheckoutInput"
