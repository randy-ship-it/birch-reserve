          type: string
          minLength: 3
          maxLength: 320
        company:
          type: string
          minLength: 2
          maxLength: 160
        website:
          type: string
          minLength: 8
          maxLength: 2048
        category:
          type: string
          minLength: 2
          maxLength: 120
        coverageRegion:
          type: string
