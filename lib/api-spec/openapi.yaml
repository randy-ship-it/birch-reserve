components:
  securitySchemes:
    ClerkSession:
      type: apiKey
      in: cookie
      name: __session
      description: Clerk browser session for an individually authenticated staff identity.
  parameters:
    UcpRequestId:
      name: Request-Id
      in: header
      required: true
      description: UUID used to correlate one authenticated UCP protocol request.
      schema: { type: string, minLength: 36, maxLength: 36, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$' }
    UcpAgent:
      name: UCP-Agent
      in: header
      required: true
      description: Declares the HTTPS profile whose Ed25519 key authenticates this request.
      schema: { type: string, pattern: '^profile="https://[^"/]+(?:\:[0-9]+)?/\.well-known/ucp"$' }
    UcpAgentTimestamp:
      name: UCP-Agent-Timestamp
      in: header
      required: true
      description: Unix timestamp in seconds, accepted within five minutes. The external agent profile must publish ucp.authentication with type ed25519, a key_id, and an Ed25519 public_key_jwk.
      schema: { type: string, pattern: '^\d{10}$' }
    UcpAgentSignature:
      name: UCP-Agent-Signature
      in: header
      required: true
      description: Base64url Ed25519 signature over method, request target, profile URL, key ID, timestamp, nonce, Idempotency-Key, and SHA-256 body digest, separated by newlines.
      schema: { type: string, minLength: 86, maxLength: 86 }
    UcpAgentNonce:
      name: UCP-Agent-Nonce
      in: header
      required: true
      description: A unique request nonce. Reuse is rejected, including during the five-minute signature window.
      schema: { type: string, minLength: 22, maxLength: 200, pattern: '^[A-Za-z0-9._~-]+$' }
    PartnerKey:
      name: x-marketplace-partner-key
      in: header
      required: true
      schema: { type: string, minLength: 24 }
    PlacementKey:
      name: x-marketplace-placement-key
      in: header
      required: true
      schema: { type: string, minLength: 24 }
    EventSignature:
      name: x-marketplace-signature
      in: header
      required: true
      schema: { type: string, minLength: 32 }
    AdminSecret:
      name: x-marketplace-admin-secret
      in: header
      required: true
      schema: { type: string, minLength: 1 }
    HostId:
      name: hostId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    PlacementId:
      name: placementId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    AdvertiserId:
      name: advertiserId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
  schemas:
    BirchReserveSku:
      type: string
      enum: [reserve-990, pilot-4900, network-9900]
    BirchReserveUcpProfile:
      type: object
      additionalProperties: true
      required: [ucp]
      properties:
        ucp:
          type: object
          additionalProperties: true
          required: [version, services, capabilities, payment_handlers]
          properties:
            version: { type: string, enum: ["2026-04-08"] }
            services: { type: object, additionalProperties: true }
            capabilities: { type: object, additionalProperties: true }
            payment_handlers:
              type: object
              additionalProperties: true
              description: Empty because delegated payment and Stripe ACP completion are not enabled.
    BirchReserveUcpCheckoutInput:
      type: object
      additionalProperties: true
      required: [line_items]
      properties:
        line_items:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            additionalProperties: true
            required: [item, quantity]
            properties:
              item:
                type: object
                additionalProperties: true
                required: [id]
                properties:
                  id: { $ref: "#/components/schemas/BirchReserveSku" }
              quantity: { type: number, enum: [1] }
        buyer:
          type: object
          additionalProperties: true
          properties:
            email: { type: string, minLength: 3, maxLength: 320 }
        context:
          type: object
          additionalProperties: true
          properties:
            brand: { type: string, minLength: 1, maxLength: 160 }
            website_url: { type: string, maxLength: 2048 }
            format_pref: { type: string, enum: [post_checkout, recovery_plan, scheduled_service, member_hub, motion_15s] }
    BirchReserveUcpIdentityRotationInput:
      type: object
      additionalProperties: false
      required: [previous_profile, idempotency_key]
      properties:
        previous_profile: { type: string, minLength: 9, maxLength: 2048 }
        idempotency_key: { type: string, minLength: 22, maxLength: 200 }
    BirchReserveUcpCheckout:
      type: object
      additionalProperties: true
      required: [ucp, id, status, currency, line_items, totals, links]
      properties:
        ucp:
          type: object
          additionalProperties: true
          required: [version, status, payment_handlers]
          properties:
            version: { type: string, enum: ["2026-04-08"] }
            status: { type: string, enum: [success] }
            capabilities: { type: object, additionalProperties: true }
            payment_handlers: { type: object, additionalProperties: true }
        id: { type: string }
        status: { type: string, enum: [incomplete, requires_escalation, completed, canceled] }
        currency: { type: string, enum: [USD] }
        line_items: { type: array, items: { type: object, additionalProperties: true } }
        totals: { type: array, items: { type: object, additionalProperties: true } }
        links: { type: array, items: { type: object, additionalProperties: true } }
        expires_at: { type: string, format: date-time, description: Actual expiry of the shared Birch Reserve inventory hold. }
        messages: { type: array, items: { type: object, additionalProperties: true }, description: Includes the mandatory buyer-handoff severity whenever status is requires_escalation. }
        continue_url: { type: string }
        order: { type: object, additionalProperties: true }
    BirchReserveUcpError:
      type: object
      additionalProperties: false
      required: [ucp, messages]
      properties:
        ucp:
          type: object
          additionalProperties: true
          required: [version, status]
          properties:
            version: { type: string, enum: ["2026-04-08"] }
            status: { type: string, enum: [error] }
        messages:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
            required: [type, code, content, severity]
            properties:
              type: { type: string, enum: [error] }
              code: { type: string }
              content: { type: string }
              severity: { type: string, enum: [recoverable, requires_buyer_input, requires_buyer_review, unrecoverable] }
    BirchReserveOffer:
      type: object
      additionalProperties: false
      required: [offer_key, sku, name, offer_type, amount_cents, due_today, media_credit_cents, scope, best_for, requires_insertion_order, guarantees_impressions]
      properties:
        offer_key: { type: string, enum: [reserve-990, pilot-4900, network-9900] }
        sku: { $ref: "#/components/schemas/BirchReserveSku" }
        name: { type: string }
        offer_type: { type: string, enum: [reservation_credit, single_format_pilot, multi_surface_pilot] }
        amount_cents: { type: integer, enum: [99000, 490000, 990000] }
        due_today: { type: integer, enum: [990, 4900, 9900] }
        media_credit_cents: { type: integer, enum: [99000, 490000, 990000] }
        scope: { type: string }
        best_for: { type: string }
        requires_insertion_order: { type: boolean, enum: [true] }
        guarantees_impressions: { type: boolean, enum: [false] }
    BirchReserveCatalog:
      type: object
      additionalProperties: false
      required: [catalog_version, currency, default_sku, inventory_model, offers, discount_vs_published, formats, exclusivity, fulfillment, reporting, checkout, human]
      properties:
        catalog_version: { type: string }
        currency: { type: string, enum: [USD] }
        default_sku: { $ref: "#/components/schemas/BirchReserveSku" }
        inventory_model: { type: string, enum: [shared_reserve_pool] }
        offers:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: "#/components/schemas/BirchReserveOffer" }
        discount_vs_published: { type: number, enum: [0.25] }
        formats: { type: array, items: { type: string, enum: [post_checkout, recovery_plan, scheduled_service, member_hub, motion_15s] } }
        exclusivity: { type: string }
        fulfillment: { type: string }
        reporting: { type: string }
        checkout: { type: string }
        human: { type: string }
    BirchReserveAvailability:
      type: object
      additionalProperties: true
      required: [currency, default_sku, skus, inventory_model, seats_total, seats_paid, seats_held, seats_open, next_window, formats_live, checkout, last_updated]
      properties:
        currency: { type: string, enum: [USD] }
        default_sku: { $ref: "#/components/schemas/BirchReserveSku" }
        skus:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: "#/components/schemas/BirchReserveSku" }
        inventory_model: { type: string, enum: [shared_reserve_pool] }
        seats_total: { type: number, multipleOf: 1 }
        seats_paid: { type: number, multipleOf: 1 }
        seats_held: { type: number, multipleOf: 1 }
        seats_open: { type: number, multipleOf: 1 }
        next_window: { type: string }
        formats_live: { type: array, items: { type: string } }
        checkout: { type: string }
        last_updated: { type: string, format: date-time }
    BirchReserveQuote:
      type: object
      additionalProperties: true
      required: [sku, offerKey, offerName, offerType, format, days, currency, amountCents, dueTodayUsd, mediaCreditCents, scope, discount, requiresInsertionOrder, guaranteesImpressions, exclusions, checkoutPath]
      properties:
        sku: { $ref: "#/components/schemas/BirchReserveSku" }
        offerKey: { type: string, enum: [reserve-990, pilot-4900, network-9900] }
        offerName: { type: string }
        offerType: { type: string, enum: [reservation_credit, single_format_pilot, multi_surface_pilot] }
        format: { type: string, enum: [post_checkout, recovery_plan, scheduled_service, member_hub, motion_15s] }
        days: { type: integer, enum: [30, 90, 180] }
        currency: { type: string, enum: [USD] }
        amountCents: { type: integer, enum: [99000, 490000, 990000] }
        dueTodayUsd: { type: integer, enum: [990, 4900, 9900] }
        mediaCreditCents: { type: integer, enum: [99000, 490000, 990000] }
        scope: { type: string }
        discount: { type: number, enum: [0.25] }
        requiresInsertionOrder: { type: boolean, enum: [true] }
        guaranteesImpressions: { type: boolean, enum: [false] }
        exclusions: { type: array, items: { type: string } }
        checkoutPath: { type: string }
    BirchReserveCheckoutInput:
      type: object
      additionalProperties: false
      required: [sku, email, brand, idempotency_key]
      properties:
        sku: { $ref: "#/components/schemas/BirchReserveSku" }
        email: { type: string, minLength: 3, maxLength: 320 }
        brand: { type: string, minLength: 1, maxLength: 160 }
        website_url: { type: string, maxLength: 2048 }
        format_pref: { type: string, enum: [post_checkout, recovery_plan, scheduled_service, member_hub, motion_15s] }
        idempotency_key: { type: string, minLength: 8, maxLength: 200 }
    BirchReserveOrderConfirmation:
      type: object
      additionalProperties: false
      required: [session_id]
      properties:
        session_id: { type: string, minLength: 8, maxLength: 255 }
    ConciergeAdviceInput:
      type: object
      additionalProperties: false
      required: [bookingIntent, awarenessIntent, comparisonIntent, privateReviewIntent, sensitiveContentDetected]
      properties:
        bookingIntent:
          type: boolean
          description: The browser detected a booking-oriented advertising question.
        awarenessIntent:
          type: boolean
          description: The browser detected an awareness-oriented advertising question.
        comparisonIntent:
          type: boolean
          description: The browser detected a request to compare advertising paths.
        privateReviewIntent:
          type: boolean
          description: The browser detected a pricing, availability, legal, contract, forecast, or outcome question that requires private review.
        sensitiveContentDetected:
          type: boolean
          description: The browser withheld possible contact, health, payment, credential, or identity information. The original text is never transmitted.
        selectedInterest:
          type: string
          enum: [performance, display, both]
          description: Optional format already being considered by the visitor.
    ConciergeAdviceResponse:
      type: object
      additionalProperties: false
      required: [message, suggestions, handoffAllowed, source]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 700
        recommendedInterest:
          type: string
          enum: [performance, display, both]
        suggestions:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
            enum: [performance, display, both, private_review]
        handoffAllowed:
          type: boolean
          description: True only when a validated advertising-format recommendation can preselect the request form.
        source:
          type: string
          enum: [ai, fallback]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LaunchStatus:
      type: object
      required: [mode, message]
