        packages:
          type: array
          items:
            $ref: "#/components/schemas/SponsorPackage"
    SponsorReservationInput:
      type: object
      required:
        [
          packageType,
          accessRoute,
          buyerEmail,
          buyerName,
          companyName,
          companyWebsite,
          requestedCategory,
          advertisingObjective,
          preferredPlacement,
          investmentRange,
          launchTimeline,
          creativeStatus,
          termsAccepted,
        ]
      properties:
        packageType:
          type: string
          enum: [brand, retail, other, clinic, physio, test_pilot]
          description: "brand/retail/other → Founding Sponsor (CAD 5k). clinic/physio → reserve-only, privately verified. test_pilot → CAD 10k reserve-only."
        accessRoute:
          type: string
          enum: [open_market, ecosystem_contributor, test_pilot]
          description: "Public request route. Contributor submissions remain pending manual eligibility verification; this field never grants priority by itself."
        buyerEmail:
          type: string
          minLength: 3
          maxLength: 320
        buyerName:
          type: string
          minLength: 2
          maxLength: 120
        companyName:
          type: string
          minLength: 2
          maxLength: 160
        companyWebsite:
          type: string
          minLength: 8
          maxLength: 2048
        requestedHubId:
          type: string
          minLength: 1
          maxLength: 120
        requestedHubName:
          type: string
          minLength: 1
          maxLength: 160
        requestedCategory:
          type: string
          minLength: 2
          maxLength: 80
        advertisingObjective:
          type: string
          enum: [brand_awareness, product_discovery, product_purchase, service_booking, other]
          description: Primary objective for the requested advertising campaign.
        preferredPlacement:
          type: string
          enum: [post_checkout, recovery_plan, booking_confirmation, member_hub, guidance_needed]
          description: Display moment the advertiser is most interested in.
        investmentRange:
          type: string
          enum: [under_5k, 5k_to_10k, 10k_to_25k, 25k_plus, exploring]
          description: Indicative campaign investment range for qualification only.
        launchTimeline:
          type: string
          enum: [within_30_days, 30_to_60_days, 60_plus_days, flexible]
          description: Advertiser's preferred campaign start window.
        creativeStatus:
          type: string
          enum: [creative_ready, needs_support, exploring]
          description: Whether campaign creative is ready or still being planned.
        additionalNotes:
          type: string
          maxLength: 1000
          description: Optional advertiser context for private review.
        termsAccepted:
          type: boolean
          description: Must be true. Reservation is rejected if false or absent.
        marketingConsent:
          type: boolean
          description: Optional explicit consent to receive Birch Reserve updates. Defaults to false.
    AdvertiserIntakeInput:
      type: object
      additionalProperties: false
      required: [email, visitorType, advertisingIntent, source, followUpConsent]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 320
          description: Email used only for the requested Birch Reserve follow-up.
        visitorType:
          type: string
          enum: [online_product, online_service, wellness_audience, other]
          description: How the visitor describes their business or audience.
        advertisingIntent:
          type: string
